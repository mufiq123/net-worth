name: Daily net worth refresh

on:
  schedule:
    # Target 9:00, 12:00 and 15:00 in Chicago. GitHub's scheduler is always UTC
    # and does not follow daylight saving, so each of those needs two entries —
    # one for CDT (UTC-5) and one for CST (UTC-6). All six fire year-round and
    # the gate job below admits only the three that are correct for the season.
    - cron: '0 14 * * *' #  9:00 CDT
    - cron: '0 15 * * *' #  9:00 CST  / 10:00 CDT
    - cron: '0 17 * * *' # 12:00 CDT
    - cron: '0 18 * * *' # 12:00 CST  / 13:00 CDT
    - cron: '0 20 * * *' # 15:00 CDT
    - cron: '0 21 * * *' # 15:00 CST  / 16:00 CDT
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write # to commit the updated data/*.json
  pages: write
  id-token: write

jobs:
  # Lets a firing through only when the cron that fired it targets 9am, noon or
  # 3pm in Chicago, which is what keeps the schedule at three runs a day on
  # both sides of the daylight saving change instead of three in winter and
  # six in summer. The scheduled hour decides, not the current clock, so a
  # firing that GitHub's scheduler starts late still runs instead of being
  # skipped.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "Chicago now: $(TZ=America/Chicago date '+%Y-%m-%d %H:%M %Z')"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding regardless of the clock."
            echo 'go=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Scheduled run: judge the cron that fired, not the current clock —
          # GitHub's scheduler is approximate and can start a firing after the
          # intended hour has already passed. github.event.schedule holds the
          # cron that fired (e.g. "0 14 * * *"); its hour field is UTC and is
          # converted here to the Chicago hour for today.
          set -- $SCHEDULE # split into minute/hour fields: $1 $2 ...
          utc_hour=$2
          sched_hour=$(TZ=America/Chicago date -d "$(date -u +%F) ${utc_hour}:00 UTC" +%-H)
          echo "Fired by cron '${SCHEDULE}': ${utc_hour}:00 UTC is ${sched_hour}:00 in Chicago."

          case "$sched_hour" in
            9|12|15)
              echo "${sched_hour}:00 in Chicago is a scheduled slot — proceeding."
              echo 'go=true' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "${sched_hour}:00 in Chicago is not a slot — this is the off-season cron, skipping."
              echo 'go=false' >> "$GITHUB_OUTPUT"
              ;;
          esac

  refresh:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # Two runs overlapping (a manual run during a scheduled one) would race on
    # the data commit; queue them instead.
    concurrency: refresh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      # continue-on-error: if Plaid is down, the page still deploys from the
      # data already committed in data/. Per-institution failures are handled
      # inside fetch.js, which keeps that institution's last snapshot.
      - name: Pull fresh data from Plaid
        continue-on-error: true
        run: node scripts/fetch.js
        env:
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
          PLAID_ENV: ${{ secrets.PLAID_ENV }}
          PLAID_TOKEN_PUBLIC: ${{ secrets.PLAID_TOKEN_PUBLIC }}
          PLAID_TOKEN_FIDELITY: ${{ secrets.PLAID_TOKEN_FIDELITY }}
          PLAID_TOKEN_MERRILL: ${{ secrets.PLAID_TOKEN_MERRILL }}

      - name: Rebuild the dashboard page
        run: node scripts/build.js

      # Rebase before pushing: three runs a day share a branch with whatever the
      # previous run committed, and a stale checkout would be rejected.
      - name: Save the new data
        run: |
          git config user.name "net-worth-bot"
          git config user.email "net-worth-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Snapshot $(TZ=America/Chicago date '+%F %H:%M %Z')"
            git pull --rebase --autostash origin main
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - uses: actions/deploy-pages@v4
