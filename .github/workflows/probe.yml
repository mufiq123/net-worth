name: Probe investment transactions (temporary)

# Manual only. Read-only: calls Plaid, uploads an encrypted file (see
# scripts/probe-transactions.js), commits nothing and deploys nothing. Delete
# this file once the question is answered.
on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: RSA public key (base64 DER) to encrypt the output to
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/probe-transactions.js
        env:
          PROBE_PUBKEY: ${{ inputs.pubkey }}
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
          PLAID_ENV: ${{ secrets.PLAID_ENV }}
          PLAID_TOKEN_PUBLIC: ${{ secrets.PLAID_TOKEN_PUBLIC }}
          PLAID_TOKEN_FIDELITY: ${{ secrets.PLAID_TOKEN_FIDELITY }}
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe.enc.json
          retention-days: 1
